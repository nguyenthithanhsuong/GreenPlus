name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  REGISTRY: ghcr.io
  # No actual service-role, Sentry auth, or Better Stack tokens in builds.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-only
  SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: '1'

jobs:
  pipeline-contracts:
    name: CI Rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint GitHub Actions workflow YAML and shell
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Validate shell scripts
        run: bash -n scripts/ci/smoke-images.sh
      - name: Test CI rules and external-check error handling
        run: node --test tests/ci-pipeline.test.mjs
      - name: Check required files and Dockerfile safety
        run: node scripts/ci/validate-ci.mjs
      - name: Fail-closed Supabase migration policy and immutable baseline
        run: node scripts/ci/supabase-migration-gate.mjs --static
      - name: Supabase/Docker Storage contract (offline)
        run: node scripts/ci/check-storage.mjs
      - name: Docker 3-tier topology / canonical schema inventory (offline)
        run: node scripts/ci/three-tier-parity-audit.mjs --static
      - name: Test SQL classifier, remote-history gate and tier contract
        run: node --test tests/ci-migration-safety.test.mjs

  frontend-ci:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: admin, node: '22', label: 'Admin CI' }
          - { app: client, node: '22', label: 'Client CI' }
          - { app: shipper, node: '22', label: 'Shipper CI' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        id: lint
        run: npm run lint -w web-${{ matrix.app }}
      - name: Typecheck (also runs if lint failed; still fails the job)
        id: typecheck
        if: success() || steps.lint.outcome == 'failure'
        run: npm run typecheck -w web-${{ matrix.app }}
      - name: Client checkout and multi-tenant tests
        if: matrix.app == 'client'
        run: node --experimental-strip-types --test web-client/tests/*.test.mjs
      - name: Shipper unit + integration tests
        if: matrix.app == 'shipper'
        run: npm test -w web-shipper
      - name: Build
        id: build
        run: npm run build -w web-${{ matrix.app }}
      - name: Shipper browser E2E tests
        if: matrix.app == 'shipper'
        env:
          # CI-only shared session key for Admin/Client/Shipper, never a production credential.
          AUTH_HANDOFF_SECRET: ci-only-shared-session-key-not-for-production-2026
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e -w web-shipper
      - name: Upload Shipper E2E diagnostics
        if: failure() && matrix.app == 'shipper'
        uses: actions/upload-artifact@v4
        with:
          name: shipper-e2e-diagnostics
          path: |
            artifacts/playwright/web-shipper/test-results/
            artifacts/playwright/web-shipper/report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Cross-app browser E2E (Admin / Client; Shipper has its own detailed E2E)
        if: success() && matrix.app != 'shipper' 
        env:
          GREENPLUS_E2E_APP: ${{ matrix.app }}
          AUTH_HANDOFF_SECRET: ci-only-shared-session-key-not-for-production-2026
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.ci.config.mts
      - name: Upload cross-app E2E diagnostics
        if: failure() && matrix.app != 'shipper' 
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.app }}-e2e-diagnostics
          path: |
            artifacts/playwright/${{ matrix.app }}/test-results/
            artifacts/playwright/${{ matrix.app }}/report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Workspace quality summary (visible even after failure)
        if: always()
        env:
          APP: ${{ matrix.app }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        shell: bash
        run: |
          {
            echo "## Web ${APP} · quality report"
            echo '| Check | Result |'
            echo '|---|---|'
            echo "| ESLint | ${LINT_RESULT:-not-run} |"
            echo "| TypeScript typecheck | ${TYPECHECK_RESULT:-not-run} |"
            echo "| Next.js build | ${BUILD_RESULT:-not-run} |"
            echo ''
            echo 'Failures stay blocking. Typecheck runs even if ESLint fails so both diagnostics appear in one run.'
          } >> "$GITHUB_STEP_SUMMARY"

  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Offline patched Next.js version gate (cannot be bypassed by registry outage)
        run: node scripts/ci/dependency-version-gate.mjs
      - name: Runtime dependency audit (confirmed high/critical block; registry outages warn)
        run: node scripts/ci/dependency-audit.mjs
      - name: Upload dependency audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: artifacts/ci/dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: All root Node tests (including tenant, gateway, security, PWA, regression)
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: HTTP integration tests (real local server + AI adapter contract)
        run: node --experimental-strip-types --test tests/integration/*.test.mjs
      - name: Check gateway and migration launcher syntax
        run: |
          node --check docker/three-tier/gateway/server.mjs
          node --check scripts/three-tier-docker.mjs
          node --check scripts/repair-three-tier-commerce.mjs
          node --check scripts/test-three-tier-transactions.mjs
          node --check scripts/test-three-tier-lifecycle.mjs

  ai-service-ci:
    name: AI Assist CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai-assist/requirements.txt
      - name: Install pinned Python AI dependencies
        run: python -m pip install -r services/ai-assist/requirements.txt pytest
      - name: Test FastAPI authentication, forecasts, grounded chat and suggestions
        env:
          PYTHONPATH: services/ai-assist
          AI_SERVICE_KEY: ci-only-private-ai-key-2026-not-production
        run: python -m pytest -q services/ai-assist/tests
      - name: Build AI container with no production secrets
        run: docker build -t greenplus/ai-assist:ci services/ai-assist
      - name: Smoke private AI service
        run: |
          set -euo pipefail
          docker run --rm -d --name greenplus-ai-ci -p 127.0.0.1:18100:8100 -e AI_SERVICE_KEY=ci-only-private-ai-key-2026-not-production greenplus/ai-assist:ci
          trap 'docker rm -f greenplus-ai-ci >/dev/null 2>&1 || true' EXIT
          for ((attempt = 1; attempt <= 30; attempt++)); do
            if curl --fail --silent http://127.0.0.1:18100/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18100/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST --header 'Content-Type: application/json' --data '{}' http://127.0.0.1:18100/v1/chat)
          test "$status" = 401

  docker-db-ci:
    name: Docker DB CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable three-tier PostgreSQL and PostgREST
        run: npm run docker:three-tier:up
      - name: Assert RPCs and API connectivity
        run: npm run docker:three-tier:check
      - name: Enumerate real store-tier assignments and free slots
        run: npm run docker:three-tier:stores
      - name: Docker catalog SQL contract (ROLLBACK)
        run: node scripts/test-three-tier-commerce.mjs
      - name: Report REAL schema gaps for all 5 Docker storage scopes
        run: node scripts/ci/three-tier-parity-audit.mjs
      - name: Inventory and checkout transactions (ROLLBACK)
        run: node scripts/test-three-tier-transactions.mjs
      - name: Payment/delivery lifecycle transactions (ROLLBACK)
        run: node scripts/test-three-tier-lifecycle.mjs
      - name: Show logs on failure (redacted configs not included)
        if: failure()
        run: docker compose --project-directory docker/three-tier logs --tail=100 gateway shared-rest enterprise-a-rest enterprise-b-rest || true
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose --project-directory docker/three-tier down --volumes --remove-orphans || true

  supabase-db-ci:
    name: Supabase DB CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ci-no-real-openai-key
      SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: ci-unused
      SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: ci-unused
      S3_HOST: ci-unused.example.invalid
      S3_REGION: test-region
      S3_ACCESS_KEY: ci-unused
      S3_SECRET_KEY: ci-unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The v1 installer downloads GitHub releases directly (504 in CI #125).
      # v3 setup installs from npm, and v2.stable avoids the CLI v3 migration.
      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable
      - name: Start disposable local Supabase (never link remote)
        run: supabase start
      - name: Rebuild from all committed migrations
        run: supabase db reset --local --no-seed
      - name: Run pgTAP schema/isolation checks
        run: supabase test db
      - name: Shut down disposable local Supabase
        if: always()
        run: supabase stop --no-backup || true

  external-services-ci:
    name: Services CI
    runs-on: ubuntu-latest
    environment: environment
    timeout-minutes: 12
    # Live provider availability is advisory; offline contracts remain strict.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test service probes offline
        run: node --test tests/ci-pipeline.test.mjs
      - name: Probe external providers (warnings only; never suppress security gates)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ADMIN: ${{ vars.VERCEL_PROJECT_ADMIN }}
          VERCEL_PROJECT_CLIENT: ${{ vars.VERCEL_PROJECT_CLIENT }}
          VERCEL_PROJECT_SHIPPER: ${{ vars.VERCEL_PROJECT_SHIPPER }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
          SENTRY_PROJECT_ADMIN: ${{ vars.SENTRY_PROJECT_ADMIN || secrets.SENTRY_PROJECT_ADMIN }}
          SENTRY_PROJECT_CLIENT: ${{ vars.SENTRY_PROJECT_CLIENT || secrets.SENTRY_PROJECT_CLIENT }}
          SENTRY_PROJECT_SHIPPER: ${{ vars.SENTRY_PROJECT_SHIPPER || secrets.SENTRY_PROJECT_SHIPPER }}
          BETTER_STACK_SOURCE_TOKEN: ${{ secrets.BETTER_STACK_SOURCE_TOKEN }}
          BETTER_STACK_URL: ${{ vars.BETTER_STACK_URL || secrets.BETTER_STACK_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/check-external.mjs --output artifacts/ci/external-services.json
      - name: Docker Gateway CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GREENPLUS_DOCKER_REMOTE_ENABLED == 'true'
        env:
          VERCEL: '1'
          GREENPLUS_TENANCY_DEMO: 'true'
          GREENPLUS_DOCKER_REMOTE_ENABLED: 'true'
          GREENPLUS_DOCKER_GATEWAY_URL: ${{ vars.GREENPLUS_DOCKER_GATEWAY_URL }}
          GREENPLUS_DOCKER_GATEWAY_HOST: ${{ vars.GREENPLUS_DOCKER_GATEWAY_HOST }}
          GREENPLUS_DOCKER_GATEWAY_KEY: ${{ secrets.GREENPLUS_DOCKER_GATEWAY_KEY }}
          GREENPLUS_DOCKER_ACCESS_CLIENT_ID: ${{ secrets.GREENPLUS_DOCKER_ACCESS_CLIENT_ID }}
          GREENPLUS_DOCKER_ACCESS_CLIENT_SECRET: ${{ secrets.GREENPLUS_DOCKER_ACCESS_CLIENT_SECRET }}
          GREENPLUS_DOCKER_REQUIRE_ALL_TIERS: 'true'
        run: node scripts/ci/check-docker-tenants.mjs --advisory
      - name: Upload remote gateway diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-docker-gateway-diagnostics
          path: artifacts/ci/docker-gateway.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload service diagnostics (no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-service-diagnostics
          path: artifacts/ci/external-services.json
          if-no-files-found: ignore
          retention-days: 14

  docker-build:
    name: Docker Build
    environment: environment
    needs: [pipeline-contracts, frontend-ci, backend-ci, ai-service-ci, docker-db-ci, supabase-db-ci, external-services-ci]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_SUPABASE_URL) || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY) || 'ci-placeholder-anon-key' }}
      NEXT_PUBLIC_SENTRY_DSN_ADMIN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN }}
      NEXT_PUBLIC_SENTRY_DSN_CLIENT: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_CLIENT }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || secrets.SENTRY_ORG }}
      SENTRY_PROJECT_ADMIN: ${{ vars.SENTRY_PROJECT_ADMIN || secrets.SENTRY_PROJECT_ADMIN }}
      SENTRY_PROJECT_CLIENT: ${{ vars.SENTRY_PROJECT_CLIENT || secrets.SENTRY_PROJECT_CLIENT }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository
        shell: bash
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: GHCR login only for guarded main publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build admin, client and shipper images (no production secrets)
        shell: bash
        run: |
          set -euo pipefail
          for app in admin client shipper; do
            docker build --file "web-${app}/Dockerfile" \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
              --build-arg NEXT_PUBLIC_SENTRY_DSN_ADMIN="$NEXT_PUBLIC_SENTRY_DSN_ADMIN" \
              --build-arg NEXT_PUBLIC_SENTRY_DSN_CLIENT="$NEXT_PUBLIC_SENTRY_DSN_CLIENT" \
              --build-arg SENTRY_ORG="$SENTRY_ORG" \
              --build-arg SENTRY_PROJECT_ADMIN="$SENTRY_PROJECT_ADMIN" \
              --build-arg SENTRY_PROJECT_CLIENT="$SENTRY_PROJECT_CLIENT" \
              --build-arg GITHUB_SHA="$GITHUB_SHA" \
              --build-arg NEXT_PUBLIC_GITHUB_SHA="$GITHUB_SHA" \
              --tag "greenplus/web-${app}:ci" .
          done
      - name: Build AI Assist image from tested Python source
        run: docker build -t greenplus/ai-assist:ci services/ai-assist
      - name: Smoke all three images before any publish
        shell: bash
        run: bash scripts/ci/smoke-images.sh
      - name: Upload Docker system smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-system-smoke
          path: artifacts/ci/docker-system-smoke.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish SHA-pinned images after every gate passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          full_sha="${GITHUB_SHA}"
          for app in admin client shipper; do
            target="ghcr.io/${REPO_LC}/web-${app}"
            docker tag "greenplus/web-${app}:ci" "${target}:sha-${full_sha}"
            docker push "${target}:sha-${full_sha}"
            for tag in main latest; do
              docker tag "greenplus/web-${app}:ci" "${target}:${tag}"
              docker push "${target}:${tag}"
            done
          done
          ai_target="ghcr.io/${REPO_LC}/ai-assist"
          docker tag greenplus/ai-assist:ci "${ai_target}:sha-${full_sha}"
          docker push "${ai_target}:sha-${full_sha}"
          for tag in main latest; do
            docker tag greenplus/ai-assist:ci "${ai_target}:${tag}"
            docker push "${ai_target}:${tag}"
          done
          echo "All three web images and the AI Assist SHA-pinned image published; deployment remains a separate, manual operation."

  ci-report:
    name: CI/CD Report
    if: always()
    needs: [pipeline-contracts, frontend-ci, backend-ci, ai-service-ci, docker-db-ci, supabase-db-ci, external-services-ci, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download optional provider health results
        if: needs.external-services-ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: external-service-diagnostics
          path: artifacts/ci
      - name: Write CI/CD summary in Actions
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-report.mjs
      - name: Upload CI gate report JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greenplus-ci-cd-report
          path: artifacts/ci/ci-report.json
          if-no-files-found: warn
          retention-days: 30
