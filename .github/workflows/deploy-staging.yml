# The original workflow only printed a success message without deploying anything.
# Make this explicit and manual until a real staging provider/URL is configured.
name: Staging Verify
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full CI-verified commit SHA whose image tags should exist in GHCR
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  verify-staging-images:
    name: Staging Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify input
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Enter a full 40-character Git commit SHA.'; exit 1; }
      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify artifacts (no deployment is configured)
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          tag="sha-${SHA:0:7}"
          for app in admin client shipper; do
            docker manifest inspect "ghcr.io/${repo}/web-${app}:${tag}" >/dev/null
            echo "PASS web-${app}:${tag} exists"
          done
          echo 'Artifacts exist. No staging deployment mechanism is configured.'
