# This is a post-CI verification of publish artifacts, NOT a fake production deploy.
# Actual Coolify/Vercel rollout must be configured independently with a deployment mechanism.
name: Production Verify
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  verify-production-images:
    name: Production Verify
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: environment
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Ensure the verified commit is still main HEAD
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest="$(git rev-parse HEAD)"
          test "$VERIFIED_SHA" = "$latest" || { echo 'CI passed for an outdated commit; not promoting it.'; exit 1; }
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm ALL three images exist for CI-verified SHA
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          tag="sha-${VERIFIED_SHA:0:7}"
          for app in admin client shipper; do
            docker manifest inspect "ghcr.io/${repo}/web-${app}:${tag}" >/dev/null
            echo "PASS web-${app}:${tag} exists"
          done
          echo 'Artifacts verified. This workflow does NOT claim Vercel/Coolify rollout is complete.'
      - name: Verify actual Vercel production deployments of same CI commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ADMIN: ${{ vars.VERCEL_PROJECT_ADMIN }}
          VERCEL_PROJECT_CLIENT: ${{ vars.VERCEL_PROJECT_CLIENT }}
          VERCEL_PROJECT_SHIPPER: ${{ vars.VERCEL_PROJECT_SHIPPER }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/ci/check-vercel-deployments.mjs
      - name: Probe deployed Client and Shipper PWA assets on HTTPS
        env:
          VERCEL_CLIENT_URL: ${{ vars.VERCEL_CLIENT_URL }}
          VERCEL_SHIPPER_URL: ${{ vars.VERCEL_SHIPPER_URL }}
        run: |
          test -n "$VERCEL_CLIENT_URL" && test -n "$VERCEL_SHIPPER_URL" || { echo 'Configure public VERCEL_CLIENT_URL and VERCEL_SHIPPER_URL repository variables.'; exit 1; }
          node scripts/check-pwa-deployment.mjs "$VERCEL_CLIENT_URL" "$VERCEL_SHIPPER_URL"
